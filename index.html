button{font:inherit;font-weight:600;font-size:.95rem;padding:11px 13px;border:0;border-radius:6px;
  background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:.74rem;min-height:1.2em;
  margin:0;letter-spacing:.03em}
.ver{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.08em;
  color:var(--muted);opacity:.7;margin:18px 0 0;text-align:left}
