<script>
const B=JSON.parse(document.getElementById('payload').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
f.addEventListener('submit',async ev=>{
  ev.preventDefault(); e.textContent='Decrypting\u2026'; b.disabled=true;
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.s),iterations:B.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.i)},key,b64(B.d));
    const html=new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(err){
    e.textContent='Wrong password. Try again.'; b.disabled=false;
    document.getElementById('p').select();
  }
});
</script></body></html>
